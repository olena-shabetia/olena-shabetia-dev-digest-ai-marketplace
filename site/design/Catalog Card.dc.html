<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<article style="position:relative;display:flex;flex-direction:column;gap:10px;padding:18px 18px 14px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:var(--radius-lg);color:var(--color-text);font-family:var(--font-body);min-width:0" style-hover="border-color:var(--color-accent)">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
    <dc-import name="Type Badge" type="{{ type }}" hint-size="80px,24px"></dc-import>
    <span style="font:12px var(--mono);opacity:.75">{{ meta }}</span>
  </div>
  <a href="#" style="font:700 17px/1.3 var(--mono);color:var(--color-text);text-decoration:none;overflow-wrap:anywhere" style-after="content:'';position:absolute;inset:0;border-radius:inherit" style-focus="outline:2px solid var(--color-accent);outline-offset:2px">{{ name }}</a>
  <p style="margin:0;font-size:14px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:pretty"><sc-for list="{{ parts }}" as="p" hint-placeholder-count="1"><span style="{{ p.s }}">{{ p.t }}</span></sc-for></p>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px;position:relative;z-index:1">
    <button class="btn btn-secondary" style="font-size:12px;min-height:30px;padding:2px 12px;gap:6px"><span style="width:13px;height:13px;background:currentColor;-webkit-mask:{{ copyIcon }} center/contain no-repeat;mask:{{ copyIcon }} center/contain no-repeat"></span>Copy install command</button>
    <a href="#" class="btn btn-ghost" style="font-size:12px;min-height:30px;color:var(--color-accent-text)">Source ↗</a>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;type&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;plugin&quot;,&quot;skill&quot;,&quot;agent&quot;,&quot;command&quot;,&quot;hook&quot;],&quot;default&quot;:&quot;skill&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;item&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;run-plan&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;plugin&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;sdd-engineering&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;version&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1.0.0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;desc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Executes an approved plan step by step.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, desc = p.desc || '';
    const terms = (p.hl || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
    let parts = [{ t: desc, s: '' }];
    if (terms.length) {
      const re = new RegExp('(' + terms.map(t => t.replace(/[^a-z0-9-]/g, '')).filter(Boolean).map(t => t + '\\w*').join('|') + ')', 'ig');
      parts = desc.split(re).filter(x => x).map(x => re.test(x) || terms.some(t => x.toLowerCase().startsWith(t)) ? { t: x, s: 'background:color-mix(in srgb,var(--color-accent) 30%,transparent);border-radius:4px;padding:0 2px;font-weight:600' } : { t: x, s: '' });
    }
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.75' stroke-linecap='round' stroke-linejoin='round'><rect x='9' y='9' width='12' height='12' rx='2'/><path d='M5 15V5a2 2 0 0 1 2-2h8'/></svg>";
    return {
      parts, type: p.type || 'skill', name: p.item,
      meta: p.type === 'plugin' ? 'v' + (p.version || '1.0.0') : 'in ' + (p.plugin || ''),
      copyIcon: 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")'
    };
  }
}
</script>
</body>
</html>
